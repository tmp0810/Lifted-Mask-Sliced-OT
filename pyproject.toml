[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lmot-research"
version = "0.1.0"
description = "Lifted Mask Optimal Transport: methods and reproducible experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "PyYAML>=6", "matplotlib>=3.7", "threadpoolctl>=3", "POT>=0.9.5,<0.10"]

[project.optional-dependencies]
gpu = ["torch>=2.2,<3"]


[tool.setuptools.packages.find]
where = ["src"]
